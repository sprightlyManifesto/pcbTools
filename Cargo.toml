[package]
name = "pcbtools"
version = "0.1.0"
edition = "2024"
description = "PCBtools: convert PCB drawings between Gerber, DXF and SVG"

[[bin]]
name = "convert"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
i_overlay = "9.2.0"
rayon = "1.12.0"
roxmltree = "0.21.2"
svgtypes = "0.16.2"
